<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 200" width="880" height="200"
     role="img" aria-label="Gabriel E. Cabrera Guzman — PhD candidate in finance, Manchester, UK">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#276DC3" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#276DC3" stop-opacity="0.04"/>
    </linearGradient>
    <clipPath id="clip"><rect width="880" height="200"/></clipPath>
  </defs>

  <rect width="880" height="200" fill="url(#bg)"/>

  <!-- guide lines -->
  <g stroke="#21262d" stroke-width="1">
    <line x1="0" y1="24" x2="880" y2="24" opacity="0.7"/>
    <line x1="0" y1="176" x2="880" y2="176" opacity="0.7"/>
    <line x1="48" y1="0" x2="48" y2="200" opacity="0.4"/>
    <line x1="568" y1="0" x2="568" y2="200" opacity="0.4"/>
  </g>
  <g fill="#30363d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">
    <text x="14" y="20">main</text>
    <text x="836" y="192" text-anchor="end">h = 1</text>
  </g>

  <!-- left text block -->
  <g font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="64" y="82" fill="#e6edf3" font-size="34" font-weight="600" letter-spacing="0.5">Gabriel E. Cabrera</text>
    <text x="64" y="114" fill="#276DC3" font-size="15" font-weight="500" letter-spacing="1.6">Ph.D. Candidate in Finance</text>
    <text x="64" y="150" fill="#7d8590" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">R · C++ · Python · Quarto · WRDS · Manchester</text>
  </g>
  <line x1="64" y1="126" x2="252" y2="126" stroke="#276DC3" stroke-width="1.5" opacity="0.85"/>
  <line x1="256" y1="126" x2="268" y2="126" stroke="#58a6a6" stroke-width="1.5" opacity="0.7"/>

  <!-- right: estimate, simulate, forecast -->
  <g clip-path="url(#clip)">
    <line x1="596" y1="152" x2="860" y2="152" stroke="#30363d" stroke-width="1"/>
    <g stroke="#21262d" stroke-width="1">
      <line x1="646" y1="58" x2="646" y2="152"/>
      <line x1="696" y1="58" x2="696" y2="152"/>
      <line x1="746" y1="58" x2="746" y2="152"/>
      <line x1="806" y1="58" x2="806" y2="152"/>
    </g>

    <!-- rolling estimation window -->
    <rect y="56" width="104" height="98" fill="#276DC3" opacity="0">
      <animate attributeName="x" values="596;596;664;664" keyTimes="0;0.28;0.62;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.07;0.07;0" keyTimes="0;0.28;0.34;0.86;1" dur="7s" repeatCount="indefinite"/>
    </rect>

    <g stroke="#3fb950" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.86;1" dur="7s" begin="0.00s" repeatCount="indefinite"/>
      <line x1="604" y1="128" x2="604" y2="142" stroke-width="1"/>
      <rect x="600.5" y="130" width="7" height="10" stroke="none"/>
    </g>
    <g stroke="#f85149" fill="#f85149" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.86;1" dur="7s" begin="0.18s" repeatCount="indefinite"/>
      <line x1="621" y1="124" x2="621" y2="136" stroke-width="1"/>
      <rect x="617.5" y="130" width="7" height="3" stroke="none"/>
    </g>
    <g stroke="#3fb950" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.86;1" dur="7s" begin="0.36s" repeatCount="indefinite"/>
      <line x1="638" y1="118" x2="638" y2="135" stroke-width="1"/>
      <rect x="634.5" y="120" width="7" height="13" stroke="none"/>
    </g>
    <g stroke="#3fb950" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.86;1" dur="7s" begin="0.54s" repeatCount="indefinite"/>
      <line x1="655" y1="112" x2="655" y2="124" stroke-width="1"/>
      <rect x="651.5" y="116" width="7" height="4" stroke="none"/>
    </g>
    <g stroke="#f85149" fill="#f85149" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.86;1" dur="7s" begin="0.72s" repeatCount="indefinite"/>
      <line x1="672" y1="108" x2="672" y2="128" stroke-width="1"/>
      <rect x="668.5" y="116" width="7" height="9" stroke="none"/>
    </g>
    <g stroke="#3fb950" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.86;1" dur="7s" begin="0.90s" repeatCount="indefinite"/>
      <line x1="689" y1="103" x2="689" y2="127" stroke-width="1"/>
      <rect x="685.5" y="107" width="7" height="18" stroke="none"/>
    </g>
    <g stroke="#f85149" fill="#f85149" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.86;1" dur="7s" begin="1.08s" repeatCount="indefinite"/>
      <line x1="706" y1="97" x2="706" y2="112" stroke-width="1"/>
      <rect x="702.5" y="107" width="7" height="2" stroke="none"/>
    </g>
    <g stroke="#3fb950" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.86;1" dur="7s" begin="1.26s" repeatCount="indefinite"/>
      <line x1="723" y1="91" x2="723" y2="112" stroke-width="1"/>
      <rect x="719.5" y="95" width="7" height="14" stroke="none"/>
    </g>
    <g stroke="#3fb950" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.86;1" dur="7s" begin="1.44s" repeatCount="indefinite"/>
      <line x1="740" y1="85" x2="740" y2="99" stroke-width="1"/>
      <rect x="736.5" y="88" width="7" height="7" stroke="none"/>
    </g>
    <g stroke="#3fb950" fill="#3fb950" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.86;1" dur="7s" begin="1.62s" repeatCount="indefinite"/>
      <line x1="757" y1="79" x2="757" y2="93" stroke-width="1"/>
      <rect x="753.5" y="82" width="7" height="6" stroke="none"/>
    </g>

    <!-- out-of-sample boundary -->
    <line x1="772" y1="50" x2="772" y2="152" stroke="#3d444d" stroke-width="1" stroke-dasharray="2 4"/>

    <!-- simulated paths -->
    <g fill="none" stroke="#58a6a6" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0;0.35;0.35;0" keyTimes="0;0.5;0.58;0.86;1" dur="7s" repeatCount="indefinite"/>
      <path d="M772,82 L794,70 L816,76 L838,60 L860,54"/>
      <path d="M772,82 L794,78 L816,86 L838,80 L860,88"/>
      <path d="M772,82 L794,88 L816,82 L838,96 L860,102"/>
    </g>

    <!-- forecast cone -->
    <path d="M772,82 L860,50 L860,116 Z" fill="url(#cone)" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.58;0.68;0.86;1" dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- point forecast -->
    <path d="M772,82 L800,76 L830,72 L860,66" fill="none" stroke="#276DC3" stroke-width="2"
          stroke-linecap="round" stroke-dasharray="4 4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.72;0.86;1" dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- status line -->
    <g fill="#7d8590" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="1">
      <text x="596" y="42" opacity="0">$ fit garch(1,1)
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.27;0.3;1" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="596" y="42" opacity="0">$ roll 250d window
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.34;0.49;0.52;1" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="596" y="42" opacity="0">$ sim 10,000 paths
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.52;0.56;0.61;0.64;1" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="596" y="42" opacity="0">$ forecast h = 1
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.68;0.86;1" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="780" y="42" fill="#484f58" opacity="0">out-of-sample
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.68;0.86;1" dur="7s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
